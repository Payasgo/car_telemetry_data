name: KM Autos Diagnostics CI/CD

on:
  push:
    branches:
      - master
      - "fix/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Python validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies for pyodbc
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python modules
        run: python -m compileall -q telemetry

      - name: Check installed dependency consistency
        run: pip check

      - name: Run automated tests when present
        shell: bash
        run: |
          if [ -d tests ] && find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest -q tests
          else
            echo "No pytest suite found in tests/; syntax and dependency checks completed."
          fi

  package:
    name: Package release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Create application bundle
        run: |
          mkdir -p dist
          zip -r "dist/km-autos-diagnostics-${GITHUB_REF_NAME}.zip" \
            telemetry firmware sql README.md requirements.txt .env.example .gitignore \
            -x "*/__pycache__/*" "*.pyc"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/km-autos-diagnostics-${GITHUB_REF_NAME}.zip" \
            --title "KM Autos Diagnostics ${GITHUB_REF_NAME}" \
            --generate-notes
